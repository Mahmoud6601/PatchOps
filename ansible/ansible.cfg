[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
timeout = 45
forks = 10
stdout_callback = default

[privilege_escalation]
# Each playbook enables privilege escalation only for SSH/Linux hosts.  A
# global sudo default breaks Windows hosts managed through WinRM.
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
